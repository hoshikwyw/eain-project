<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the scene extend under the iPhone notch / home bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f2560" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Night Garden</title>
  <!--
    The animated scene of Eain's "Night Garden" gift template: a twilight
    garden that grows and blooms, a name, and a message typed out line by line.
    It is shown inside a gift page, which sends the name, the message and the
    flower colour (js/config.js). Opened on its own it plays with sample text.
  -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="scene" class="scene" aria-label="A garden of blooming flowers">

    <!-- Layer 1: pastel twilight sky, stars, moon, clouds -->
    <div id="sky" class="layer layer--sky" aria-hidden="true">
      <div class="sky__glow"></div>
      <div id="stars" class="sky__stars"></div>
      <div id="shooting-stars" class="sky__shooting"></div>

      <div class="moon">
        <div class="moon__halo"></div>
        <div class="moon__body"></div>
        <!-- Sleepy blushing moon face -->
        <svg class="moon__face" viewBox="-50 -50 100 100">
          <ellipse class="moon__cheek" cx="-25" cy="10" rx="9" ry="5.5" />
          <ellipse class="moon__cheek" cx="25" cy="10" rx="9" ry="5.5" />
          <g class="moon__sleep">
            <path d="M-23 -3 Q -16 4 -9 -3" />
            <path d="M9 -3 Q 16 4 23 -3" />
            <path d="M-5 13 Q 0 17 5 13" />
          </g>
        </svg>
      </div>

      <!-- Fluffy clouds drift in front of the moon (filled by JS) -->
      <div id="clouds" class="sky__clouds"></div>

      <!-- Soft pastel hills, far → near; flowers grow from the front hill -->
      <svg class="ground" viewBox="0 0 400 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3a6c8" />
            <stop offset="100%" stop-color="#c98bc0" />
          </linearGradient>
          <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a985cf" />
            <stop offset="100%" stop-color="#7c62ad" />
          </linearGradient>
          <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5d4a96" />
            <stop offset="100%" stop-color="#3a2d6b" />
          </linearGradient>
        </defs>
        <path class="ground__far" fill="url(#hillFar)" opacity="0.85"
          d="M0 52 C 50 30, 110 34, 160 46 S 290 18, 400 42 L 400 160 L 0 160 Z" />
        <path class="ground__back" fill="url(#hillBack)"
          d="M0 70 C 60 40, 120 45, 180 62 S 300 30, 400 55 L 400 160 L 0 160 Z" />
        <path class="ground__front" fill="url(#hillFront)"
          d="M0 105 C 70 85, 140 95, 210 100 S 330 82, 400 98 L 400 160 L 0 160 Z" />
      </svg>
    </div>

    <!-- Layer 2: the flowers -->
    <div id="garden" class="layer layer--garden" aria-hidden="true"></div>

    <!-- Layer 3: fireflies, pollen, falling petals -->
    <canvas id="particles" class="layer layer--particles" aria-hidden="true"></canvas>

    <!-- Layer 4: the name and message, filled in by js/message.js -->
    <section id="message" class="layer layer--message"></section>

    <!-- "Tap to bloom" hint, shown after the message; its text comes from the config -->
    <p id="tap-hint" class="tap-hint"></p>
  </main>

  <!-- GSAP for timeline animations (local copy: nothing is fetched from another site) -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/bloom.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/message.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
